<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grade-tracker</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }
      body {
        margin: 0;
        background-image:
          repeating-linear-gradient(0deg, rgba(148, 163, 184, 0.09) 0px, rgba(148, 163, 184, 0.09) 1px, transparent 1px, transparent 24px),
          repeating-linear-gradient(90deg, rgba(148, 163, 184, 0.07) 0px, rgba(148, 163, 184, 0.07) 1px, transparent 1px, transparent 24px),
          radial-gradient(circle at 14% 18%, rgba(16, 185, 129, 0.18) 0%, transparent 42%),
          radial-gradient(circle at 84% 11%, rgba(14, 165, 233, 0.2) 0%, transparent 40%),
          radial-gradient(circle at 78% 82%, rgba(59, 130, 246, 0.14) 0%, transparent 36%),
          linear-gradient(140deg, #f8fbff 0%, #eef7ff 46%, #edfdf5 100%);
        color: #334155;
      }
      #boot-fallback {
        min-height: 100vh;
        display: none;
        align-items: center;
        justify-content: center;
        background: transparent;
        color: #334155;
        padding: 24px;
        box-sizing: border-box;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #boot-fallback .panel {
        width: min(92vw, 460px);
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 14px 32px rgba(15, 23, 42, 0.12);
      }
      #boot-fallback .title {
        margin: 0;
        font-size: 18px;
        font-weight: 800;
        color: #0f172a;
      }
      #boot-fallback .detail {
        margin: 10px 0 0;
        font-size: 13px;
        line-height: 1.5;
        color: #475569;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback">
      <div class="panel">
        <h1 class="title" data-boot-title>系統載入中</h1>
        <p class="detail" data-boot-detail>如果超過 7 秒仍無畫面，請先重新整理；若持續失敗，系統會顯示錯誤訊息。</p>
      </div>
    </div>
    <script>
      (function () {
        var hasMounted = function () {
          return document.body && document.body.dataset && document.body.dataset.appMounted === '1';
        };
        var setFallback = function (title, detail) {
          var root = document.getElementById('boot-fallback');
          if (!root) return;
          var titleEl = root.querySelector('[data-boot-title]');
          var detailEl = root.querySelector('[data-boot-detail]');
          if (titleEl) titleEl.textContent = title || '系統載入中';
          if (detailEl) detailEl.textContent = detail || '';
          root.style.display = 'flex';
        };

        var hideFallback = function () {
          var root = document.getElementById('boot-fallback');
          if (root) root.style.display = 'none';
        };

        var loadingTimer = setTimeout(function () {
          if (hasMounted()) return;
          setFallback('系統載入中', '正在初始化資料，請稍候...');
        }, 1200);

        var timeoutTimer = setTimeout(function () {
          if (hasMounted()) return;
          setFallback('載入逾時', '程式初始化超時。請按 Cmd+Shift+R 強制重新整理，或稍後再試。');
        }, 7000);

        window.addEventListener('grade-tracker:boot-ready', function () {
          clearTimeout(loadingTimer);
          clearTimeout(timeoutTimer);
          hideFallback();
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
